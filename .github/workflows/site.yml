name: Build & Deploy (staging/main)

on:
  push:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write # pull from GHCR with GITHUB_TOKEN
  pages: write # deploy GitHub Pages
  id-token: write # required by deploy-pages

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lowercase repo path for GHCR (required)
      - name: Compute namespace
        id: ns
        run: echo "image_ns=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build site image from your Dockerfile.site using the prebuilt deps image
      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.site
          push: false
          tags: pxt-site:ci
          build-args: |
            DEPS_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/pxt-deps:main
            ATISA_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract the static output from the image
      - name: Copy /out/site
        run: |
          cid=$(docker create pxt-site:ci)
          mkdir -p site
          docker cp "$cid":/out/site/. site/
          docker rm "$cid"
          ls -lah site || true
          ls -lah site/static || true

      # Pages deploy (same steps for both branches)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          # preview for any non-main branch (staging), production for main
          preview: ${{ github.ref_name != 'main' }}

      - name: Show URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page_url }}"
