# .github/workflows/publish.yml
name: Build & Publish (PXT → gh-pages)

on:
  push:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push to gh-pages
  packages: read    # pull GHCR deps image

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute GHCR namespace
        id: ns
        run: echo "image_ns=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish with deps image (PXT pushes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Use the deps toolchain in a container, but operate on THIS repo via bind mount
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "$PWD:/work" -w /work/pxt-atisa \
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/pxt-deps:main \
            bash -lc '
              set -euo pipefail

              # Build from the branch that triggered this workflow
              git fetch origin
              git checkout "${{ github.ref_name }}"
              git pull --ff-only origin "${{ github.ref_name }}"

              # Configure git so PXT can commit/push gh-pages
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

              # 1) Build for GitHub Pages (creates/updates ./gh-pages worktree)
              pxt staticpkg --githubpages

              # 2) Merge docs/static into the published /static (include dotfiles)
              mkdir -p ../gh-pages/static
              cp -R docs/static/. ../gh-pages/static/

              # 3) Commit & push the added static files
              git -C ../gh-pages add .
              # Do not fail if nothing changed
              git -C ../gh-pages commit -m "Add/refresh docs/static assets" || true
              git -C ../gh-pages push origin gh-pages
            '

      # Optional: print the site URL
      - name: Show URL
        run: echo "https://$(echo '${{ github.repository_owner }}' | tr A-Z a-z).github.io/${{ github.event.repository.name }}/"
