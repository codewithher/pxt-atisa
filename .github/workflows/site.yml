name: Build & Deploy PXT Static Site

on:
  push:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute lower-case namespace
        id: ns
        run: |
          # github.repository is Owner/Repo; make it lower-case for GHCR
          echo "image_ns=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set env for branch
        id: br
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "atisa_ref=main" >> $GITHUB_OUTPUT
            echo "deps_tag=pxt-deps:main" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "atisa_ref=staging" >> $GITHUB_OUTPUT
            # still reuse the same deps tag (or make a pxt-deps:staging if you prefer)
            echo "deps_tag=pxt-deps:main" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try pull deps image
        id: pull-deps
        continue-on-error: true
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/${{ steps.br.outputs.deps_tag }}

      - name: Build & push deps image (fallback)
        if: steps.pull-deps.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deps
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/${{ steps.br.outputs.deps_tag }}
          build-args: |
            PXT_REF=main
            PXT_LIB_REF=main
            ATISA_REF=${{ steps.br.outputs.atisa_ref }}

      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.site
          platforms: linux/amd64
          push: false
          tags: pxt-site:ci
          build-args: |
            DEPS_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/${{ steps.br.outputs.deps_tag }}
            ATISA_REF=${{ steps.br.outputs.atisa_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract /out/site to workspace
        run: |
          cid=$(docker create pxt-site:ci)
          docker cp "$cid":/out/site/. site/
          docker rm "$cid"
          ls -lah site || true
          ls -lah site/static || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.ref_name }}
          path: site

  deploy_staging:
    if: github.ref_name == 'staging'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-staging
          path: ./site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages (staging preview)
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Show preview URL
        run: |
          echo "Preview URL: ${{ steps.deployment.outputs.page_url }}"

  deploy_production:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-main
          path: ./site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages (production)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show production URL
        run: |
          echo "Production URL: ${{ steps.deployment.outputs.page_url }}"
