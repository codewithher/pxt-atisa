name: Build & Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute namespace
        id: ns
        run: echo "image_ns=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build site image
        run: |
          docker build \
            -f Dockerfile.site \
            --build-arg DEPS_IMAGE=${{ env.REGISTRY }}/${{ steps.ns.outputs.image_ns }}/pxt-deps:main \
            --build-arg ATISA_REF=staging \
            -t pxt-site:staging .

      - name: Extract static site from image
        run: |
          mkdir -p ./site
          cid=$(docker create pxt-site:staging)
          docker cp "$cid":/out/site/. ./site
          docker rm "$cid"
          ls -lah site || true
          ls -lah site/static || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to gh-pages branch
        if: ${{ success() }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Show URL
        run: |
          echo "Pages URL: ${{ steps.deploy.outputs.page_url }}"