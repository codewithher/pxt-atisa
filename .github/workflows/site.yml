name: Build & Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build site image
        run: |
          docker build \
            -f Dockerfile.site \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t site:${{ github.sha }} .

      - name: Extract static site from image
        run: |
          cid=$(docker create site:${{ github.sha }})
          # 🔧 Update /site if your build output lives elsewhere (e.g., /app/dist)
          docker cp "$cid":/site ./_site
          docker rm "$cid"
          test -d _site && ls -al _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
